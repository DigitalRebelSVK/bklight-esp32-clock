; BK-Light ESP32 clock - PlatformIO project.
; Copy src/clock_config.example.h to src/clock_config.h first, then pick an environment:
;   pio run -e esp32-64x16 -t upload && pio device monitor

[platformio]
default_envs = esp32-64x16

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Wi-Fi + TLS + BLE is ~1.3-1.5 MB: 1.9 MB app slots, two of them for OTA
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.2
  bblanchon/ArduinoJson@^7.4.2

; Classic ESP32 DevKit + 64x16 panel (the tested combination)
[env:esp32-64x16]
board = esp32dev
build_flags = ${env.build_flags} -DPANEL_W=64 -DPANEL_H=16

; Classic ESP32 DevKit + 32x32 panel
[env:esp32-32x32]
board = esp32dev
build_flags = ${env.build_flags} -DPANEL_W=32 -DPANEL_H=32

; ESP32-S3 DevKitC + 64x16 panel (set I2C_SDA 8 / I2C_SCL 9 and an ADC1 pin
; such as GPIO4 for PT_ADC_PIN in clock_config.h)
[env:s3-64x16]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DPANEL_W=64 -DPANEL_H=16

; Over-the-air upload once the clock runs this firmware:
;   pio run -e esp32-64x16 -t upload --upload-port clock.local
; with  upload_protocol = espota  and  upload_flags = --auth=YOUR_OTA_PASSWORD
; in the environment.
